<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)" />
  <!-- Pattern Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <line x1="0" y1="420" x2="400" y2="420" />
  </g>
  <!-- Frame Ring -->
  <circle cx="200" cy="180" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>
  <circle cx="200" cy="180" r="86" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="38" fill="#e2e8f0" />
  <!-- Body / Shoulders -->
  <path d="M 140 236 C 140 198, 260 198, 260 236 C 260 246, 140 246, 140 236 Z" fill="#cbd5e1" />
  <!-- Tie / Lapel -->
  <path d="M 195 204 L 205 204 L 202 230 L 198 230 Z" fill="#0e7490" />
  <!-- Badge -->
  <g transform="translate(140, 290)">
    <rect width="120" height="28" rx="14" fill="#f59e0b" />
    <text x="60" y="18" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FOUNDER</text>
  </g>
  <!-- Text Label -->
  <text x="200" y="350" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Founder's Space</text>
  <text x="200" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">HOMline • AMDG Group • YUVA Manass</text>
  <!-- Instruction note -->
  <rect x="50" y="405" width="300" height="42" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
  <text x="200" y="423" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Photo Placement Frame</text>
  <text x="200" y="438" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Upload photo or save as founder.jpg</text>
</svg>
